<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>L7ssab.ma — Admin</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a7a4a'/%3E%3Crect x='12' y='12' width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%231a7a4a' text-anchor='middle'%3EL7%3C/text%3E%3C/svg%3E"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<meta name="theme-color" content="#1a7a4a"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="main-app">
  <div class="hdr">
    <span class="hdr-title" id="hdr-title">Database</span>
    <div class="hdr-right">
      <button class="hdr-btn" onclick="location.reload()" title="Refresh">↻</button>
      <button class="hdr-btn" onclick="toggleFS()" title="Fullscreen">⛶</button>
      <div class="hdr-av" id="hdr-av" onclick="toggleAvMenu()">?</div>
      <div class="av-menu" id="av-menu">
        <div class="av-head"><div class="n" id="av-name">—</div><div class="r" id="av-role">—</div></div>
        <button onclick="goProf()">👤 My profile</button>
        <button onclick="doInstall()" class="install-btn hidden" style="color:#1a7a4a">📲 Install app</button>
        <button onclick="logout()">🚪 Logout</button>
      </div>
    </div>
  </div>
  <div class="tabbar" id="admin-tabs">
    <button id="tab-database" class="active" onclick="showPage('database')">🗄️ Database</button>
    <button id="tab-users" onclick="showPage('users')">👥 Users</button>
  </div>
  <div id="pg-database" class="page"><div class="content">
    <div class="card"><div class="card-title" id="t-statistics">Statistics</div>
      <div class="db-stats">
        <div class="db-stat"><div class="db-val" id="db-pc">0</div><div class="db-lbl" id="t-lbl-prod">Products</div></div>
        <div class="db-stat"><div class="db-val" id="db-prc">0</div><div class="db-lbl" id="t-lbl-proj">Projects</div></div>
        <div class="db-stat"><div class="db-val" id="db-uc">0</div><div class="db-lbl" id="t-lbl-usr">Users</div></div>
      </div>
    </div>
    <div class="card"><div class="card-title" id="t-search-edit">Search / edit a product</div>
      <input class="inp" type="text" id="db-search" placeholder="Name or barcode…" oninput="dbSearch(this.value)"/>
      <div id="db-results"></div>
    </div>
    <div class="card"><div class="card-title" id="t-all-prods">All products</div>
      <div style="max-height:420px;overflow-y:auto">
        <table class="rtbl"><thead><tr><th style="width:120px" id="th-code">Code-barres</th><th id="th-pname">Name</th><th style="text-align:right;width:80px" id="th-pprice">Price</th><th style="width:70px"></th></tr></thead><tbody id="db-all-tbody"></tbody></table>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-p" style="flex:1;min-width:140px" onclick="toggleAddForm()" id="t-add-toggle">+ Add a product</button>
        <button class="btn-p" style="flex:1;min-width:140px;background:#2563eb" onclick="G('csv-file').click()" id="t-csv-btn">⬆️ Import CSV</button>
        <input type="file" id="csv-file" accept=".csv,text/csv" style="display:none" onchange="importCSV(this.files[0])"/>
      </div>
      <div id="db-add-form" class="hidden" style="margin-top:12px">
        <input class="inp" type="text" id="db-bc" placeholder="Barcode"/>
        <input class="inp" type="text" id="db-nm" placeholder="Product name"/>
        <input class="inp" type="number" id="db-pr" placeholder="Price (DH)"/>
        <button class="btn-p" onclick="dbAddProd()" id="t-add-prod-btn">+ Add product</button>
      </div>
      <p style="font-size:11px;color:#999;margin-top:10px" id="t-csv-hint">CSV: 3 colonnes — code-barres, nom, prix</p>
    </div>
  </div></div>
  <div id="pg-users" class="page"><div class="content">
    <div class="card">
      <div class="card-title" id="t-createuser">Create a user</div>
      <input class="inp" type="text" id="new-uname" placeholder="Username"/>
      <input class="inp" type="text" id="new-ufull" placeholder="Full name"/>
      <input class="inp" type="password" id="new-upin" placeholder="PIN (6 digits)" maxlength="6"/>
      <select class="inp" id="new-urole"><option value="user">User</option><option value="admin">Administrator</option></select>
      <p class="hidden" id="user-err" style="color:#d63031;font-size:13px;margin-bottom:8px"></p>
      <button class="btn-p" onclick="doCreateUser()" id="t-createbtn">Create</button>
    </div>
    <div class="card"><div class="card-title" id="t-userslist">Users</div>
      <table class="utbl"><thead><tr><th id="th-name">User</th><th id="th-role">Role</th><th>PIN</th><th id="th-act">Actions</th></tr></thead><tbody id="users-tbody"></tbody></table>
    </div>
  </div></div>
  <div id="pg-profile" class="page"><div class="content">
    <div class="card" style="text-align:center">
      <div id="prof-av" style="width:72px;height:72px;border-radius:50%;background:#1a7a4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto 10px">?</div>
      <p style="font-size:17px;font-weight:600;margin-bottom:6px" id="prof-name">—</p>
      <span class="badge" id="prof-badge">—</span>
    </div>
    <div class="card"><div class="card-title" id="t-chgname">Changer le nom</div>
      <input class="inp" type="text" id="prof-newname"/>
      <button class="btn-p" onclick="updateProf('name')" id="t-update1">Mettre à jour</button>
    </div>
    <div class="card"><div class="card-title" id="t-chgpin">Changer le PIN</div>
      <input class="inp" type="password" id="prof-newpin" placeholder="Nouveau PIN (6 chiffres)" maxlength="6"/>
      <input class="inp" type="password" id="prof-confpin" placeholder="Confirmer le PIN" maxlength="6"/>
      <button class="btn-p" onclick="updateProf('pin')" id="t-update2">Mettre à jour</button>
    </div>
    <div class="card hidden" id="back-to-app-card">
      <button class="btn-g" style="width:100%" onclick="backToApp()" id="t-backapp">← Retour</button>
    </div>
  </div></div>
</div>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
