<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>L7ssab.ma — Connexion</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a7a4a'/%3E%3Crect x='12' y='12' width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%231a7a4a' text-anchor='middle'%3EL7%3C/text%3E%3C/svg%3E"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<meta name="theme-color" content="#1a7a4a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login-page">
  <div id="login-topbar" style="position:absolute;top:14px;right:14px;display:flex;gap:8px">
    <button onclick="location.reload()" title="Rafraîchir" style="padding:6px 12px;border-radius:8px;font-size:13px;background:#fff;border:.5px solid #ccc">↻</button>
    <button onclick="toggleFS()" title="Plein écran" style="padding:6px 12px;border-radius:8px;font-size:13px;background:#fff;border:.5px solid #ccc">⛶</button>
    <button onclick="doInstall()" class="install-btn hidden" style="padding:6px 12px;border-radius:8px;font-size:13px;background:#1a7a4a;color:#fff;border:none">📲 Installer</button>
    <button onclick="toggleLang()" id="lang-login-btn" style="padding:6px 12px;border-radius:8px;font-size:13px;background:#fff;border:.5px solid #ccc">🇫🇷 FR</button>
  </div>
  <div style="text-align:center;margin-bottom:18px">
    <div class="logo-box">📦</div>
    <h1 style="font-size:24px;font-weight:700;color:#1a7a4a">L7ssab.ma</h1>
    <p style="font-size:13px;color:#666;margin-top:4px">Connexion</p>
  </div>
  <div class="login-card">
    <div id="login-step-plus">
      <p id="t-quicklogin" style="font-size:13px;color:#666;text-align:center;margin-bottom:12px">Choisissez votre compte</p>
      <div class="user-circles" id="remembered-circles"></div>
    </div>
    <div id="login-step-username" class="hidden">
      <p style="font-size:13px;font-weight:600;color:#1a7a4a;margin-bottom:10px" id="t-enter-uname">Entrez votre nom d'utilisateur</p>
      <input class="inp" type="text" id="login-username" placeholder="Nom d'utilisateur" onkeydown="if(event.key==='Enter')loginCheckUser()"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn-g" onclick="backToPlus()">Annuler</button>
        <button class="btn-p" style="margin-top:0" onclick="loginCheckUser()">Continuer →</button>
      </div>
    </div>
    <div id="login-step-pin" class="hidden">
      <div style="text-align:center;margin-bottom:6px">
        <div id="login-av" style="width:54px;height:54px;border-radius:50%;background:#1a7a4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 6px">?</div>
        <p id="login-greeting" style="font-size:15px;font-weight:600;color:#111"></p>
      </div>
      <p id="t-pin" style="font-size:13px;color:#666;text-align:center;margin-bottom:4px">Entrez votre PIN</p>
      <div class="pin-dots" id="pdots">
        <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div><div class="pin-dot" id="pd4"></div><div class="pin-dot" id="pd5"></div>
      </div>
      <div class="pin-grid" id="pkeys"></div>
      <button class="btn-g" style="width:100%;margin-top:12px" onclick="backToPlus()">← Retour</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
