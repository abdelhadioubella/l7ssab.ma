<body>
<div id="app-header"></div>
<div class="page active"><div class="content">
    <div class="card">
      <p style="font-size:14px;color:#666;margin-bottom:14px" id="t-adjdesc">Ajoutez frais, remises ou corrections.</p>
      <div id="adj-list"></div>
      <button class="btn-p" style="background:transparent;color:#1a7a4a;border:1.5px dashed #1a7a4a" onclick="addAdj()" id="t-addline">+ Ajouter une ligne</button>

    <div class="nav-row">

</div></div>
<div id="np-ov" class="hidden" onclick="if(event.target===this)closeNP()">

    <p id="np-lbl" style="font-size:13px;color:#666;margin-bottom:8px;text-align:center"></p>
    <div class="np-disp" id="np-disp">0</div>
    <div class="np-grid" id="np-grid"></div>
