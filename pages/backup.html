<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>L7ssab.ma</title>
<link rel="manifest" href="../manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a7a4a'/%3E%3Crect x='12' y='12' width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%231a7a4a' text-anchor='middle'%3EL7%3C/text%3E%3C/svg%3E"/>
<link rel="icon" type="image/png" href="../assets/icon-192.png"/>
<meta name="theme-color" content="#1a7a4a"/>
<link rel="apple-touch-icon" href="../assets/icon-192.png"/>
<link rel="stylesheet" href="../css/styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app-header"></div>
<div class="page active"><div class="content">
  <div class="card"><div class="card-title">Export</div>
    <p style="font-size:13px;color:#888;margin-bottom:12px">Download your data as files you can keep or open in Excel.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn-p" onclick="exportProducts('csv')">⬇️ Products CSV</button>
      <button class="btn-p" onclick="exportProducts('json')">⬇️ Products JSON</button>
      <button class="btn-p" onclick="exportUsers('csv')">⬇️ Users CSV</button>
      <button class="btn-p" onclick="exportUsers('json')">⬇️ Users JSON</button>
    </div>
    <button class="btn-p" style="margin-top:10px;background:#0f5132" onclick="exportFull()">💾 Full backup (JSON)</button>
  </div>
  <div class="card"><div class="card-title">Import</div>
    <p style="font-size:13px;color:#888;margin-bottom:12px">Restore products/users from a file. Duplicates are skipped.</p>
    <div class="ml" style="font-size:12px;font-weight:600;color:#666;margin-bottom:4px">Products (CSV or JSON)</div>
    <input type="file" id="imp-prod" accept=".csv,.json" onchange="importProducts(this.files[0])" style="margin-bottom:10px"/>
    <div class="ml" style="font-size:12px;font-weight:600;color:#666;margin:10px 0 4px">Users (JSON only — keeps hashed PIN)</div>
    <input type="file" id="imp-users" accept=".json" onchange="importUsers(this.files[0])" style="margin-bottom:10px"/>
    <div class="ml" style="font-size:12px;font-weight:600;color:#666;margin:10px 0 4px">Full backup (JSON)</div>
    <input type="file" id="imp-full" accept=".json" onchange="importFull(this.files[0])"/>
  </div>
  <div id="backup-log" style="font-size:12px;color:#888"></div>
</div></div>
<script src="../js/config.js"></script>
<script src="../js/backup.js"></script>
</body>
</html>
