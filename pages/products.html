<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>L7ssab.ma</title>
<link rel="manifest" href="../manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a7a4a'/%3E%3Crect x='12' y='12' width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%231a7a4a' text-anchor='middle'%3EL7%3C/text%3E%3C/svg%3E"/>
<link rel="icon" type="image/png" href="../assets/icon-192.png"/>
<meta name="theme-color" content="#1a7a4a"/>
<link rel="apple-touch-icon" href="../assets/icon-192.png"/>
<link rel="stylesheet" href="../css/styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app-header"></div>
<div class="page active"><div class="content">
    <div class="card">
      <div class="card-title" id="t-addprod">Ajouter un produit</div>
      <div class="sc-card" id="scanner-card">
        <div class="sc-row" style="margin-bottom:6px">
          <span class="sc-name" style="font-weight:700"><span id="t-scanner">Scanner</span></span>
        </div>
        <div class="sc-row" style="margin-bottom:6px">
          <span class="sc-name"><span class="sc-dot" id="usb-mini-dot" style="background:#ccc"></span><span id="usb-mini-lbl">USB</span></span>
          <span class="badge b-off" id="usb-mini-badge">Non détecté</span>
        </div>
        <div class="sc-row">
          <span class="sc-name"><span class="sc-dot" id="bt-mini-dot" style="background:#ccc"></span><span id="bt-mini-lbl">Bluetooth</span></span>
          <button id="bt-mini-btn" onclick="connectBT()" style="padding:5px 12px;font-size:12px;font-weight:600;background:#1a7a4a;color:#fff;border:none;border-radius:8px">Connecter</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input class="inp" type="text" id="scan-inp" placeholder="Scannez ou tapez le code-barres…" style="flex:1;margin-bottom:0" autocomplete="off" inputmode="numeric"/>
        <button onclick="doScan()" style="padding:11px 16px;background:#1a7a4a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;flex-shrink:0" id="t-search">Rechercher</button>
      </div>
      <div id="scan-msg" class="smsg hidden"></div>
      <input class="inp" type="text" id="pname-inp" placeholder="Nom du produit"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
        <div class="num-field" onclick="openNP('dP','Prix (DH)',true)"><span class="nf-label" id="t-price">Prix (DH)</span><span id="nf-dp" class="nf-ph">Appuyer</span></div>
        <div class="num-field" onclick="openNP('dQ','Quantite',false)"><span class="nf-label" id="t-qty">Quantité</span><span id="nf-dq" class="nf-ph">Appuyer</span></div>
      </div>
      <button class="btn-p" onclick="addProd()" id="t-addbtn">+ Ajouter</button>
    </div>
    <div class="card hidden" id="edit-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="card-title" style="margin-bottom:0" id="edit-title">Produit</div>
        <div style="display:flex;gap:6px">
          <button onclick="prevP()" style="padding:8px 14px;background:#f5f5f5;border:.5px solid #ccc;border-radius:8px">◀</button>
          <button onclick="nextP()" style="padding:8px 14px;background:#f5f5f5;border:.5px solid #ccc;border-radius:8px">▶</button>
        </div>
      </div>
      <input class="inp" type="text" id="psearch" placeholder="Rechercher dans les produits…" oninput="filterP(this.value)" style="margin-bottom:10px"/>
      <div id="psearch-res" class="hidden"></div>
      <div id="edit-form">
        <input class="inp" type="text" id="edit-name"/>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
          <div class="num-field" onclick="openNP('eP','Prix (DH)',true)"><span class="nf-label">Prix (DH)</span><span id="nf-ep" class="nf-ph">—</span></div>
          <div class="num-field" onclick="openNP('eQ','Quantite',false)"><span class="nf-label">Quantité</span><span id="nf-eq" class="nf-ph">—</span></div>
        </div>
        <div id="edit-sub" class="hidden" style="padding:10px 12px;background:#f5f5f5;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;margin-bottom:10px">
          <span style="color:#666">Sous-total</span><strong id="edit-sub-val"></strong>
        </div>
        <button class="btn-r" style="width:100%" onclick="delP()">🗑 Supprimer</button>
      </div>
    </div>
    <div class="tbar hidden" id="run-total"><span id="t-runtotal">Total provisoire</span><span id="rtval">0.00 DH</span></div>
    <div class="nav-row">
      <button class="btn-g" onclick="location.href='inventory.html'" id="t-back1">← Retour</button>
      <button class="btn-p" style="margin-top:0" onclick="location.href='adjustments.html'" id="t-next1">Suivant →</button>
    </div>
</div></div>
<div id="np-ov" class="hidden" onclick="if(event.target===this)closeNP()">
  <div class="np-panel">
    <p id="np-lbl" style="font-size:13px;color:#666;margin-bottom:8px;text-align:center"></p>
    <div class="np-disp" id="np-disp">0</div>
    <div class="np-grid" id="np-grid"></div>
    <button id="np-dot-btn" onclick="npDot()" style="width:100%;padding:13px;font-size:20px;background:#f5f5f5;border:.5px solid #e0e0e0;border-radius:12px;margin-bottom:8px">.</button>
    <div class="np-acts">
      <button class="btn-g" onclick="closeNP()" id="t-cancel">Annuler</button>
      <button class="btn-p" style="margin-top:0" onclick="confirmNP()" id="t-ok">Confirmer ✓</button>
    </div>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/products.js"></script>
</body>
</html>
