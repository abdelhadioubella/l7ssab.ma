<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Test Scanner</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#0f1614;color:#e8f0ec}
  h1{font-size:18px;color:#37c87f}
  .box{background:#18211d;border:2px solid #1a7a4a;border-radius:12px;padding:14px;margin-bottom:14px}
  .lbl{font-size:12px;color:#9bb3a8;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:2px solid #2a3a33;border-radius:10px;background:#0f1614;color:#fff;font-family:monospace}
  .out{font-family:monospace;font-size:13px;background:#000;color:#0f0;padding:12px;border-radius:8px;min-height:120px;white-space:pre-wrap;word-break:break-all;margin-top:8px;line-height:1.6}
  .big{font-size:26px;color:#37c87f;font-weight:bold;text-align:center;padding:10px;font-family:monospace}
  button{width:100%;padding:14px;font-size:16px;background:#1a7a4a;color:#fff;border:none;border-radius:10px;margin-top:8px;font-weight:bold}
</style>
</head>
<body>
<h1>Test Scanner - L7ssab</h1>
<div class="box">
  <div class="lbl">1) Cliquez ici puis SCANNEZ un code-barres :</div>
  <input id="f" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scannez ici..."/>
  <div class="lbl" style="margin-top:10px">Contenu du champ (ce que le scanner a ecrit) :</div>
  <div class="big" id="fieldval">-</div>
</div>
<div class="box">
  <div class="lbl">2) Journal des touches (key / keyCode / which) :</div>
  <div class="out" id="log">En attente d'un scan...</div>
  <button onclick="document.getElementById('log').textContent='';lines=[];document.getElementById('reconstructed').textContent='-';document.getElementById('f').value='';document.getElementById('fieldval').textContent='-';buf='';">Effacer</button>
</div>
<div class="box">
  <div class="lbl">3) Code reconstruit a partir des keyCodes :</div>
  <div class="big" id="reconstructed">-</div>
</div>
<script>
var logEl=document.getElementById('log');
var fieldEl=document.getElementById('f');
var fieldval=document.getElementById('fieldval');
var recon=document.getElementById('reconstructed');
var buf='';
var lines=[];
function kc2char(kc,shift){
  if(kc>=48&&kc<=57)return String.fromCharCode(kc);
  if(kc>=96&&kc<=105)return String.fromCharCode(kc-48);
  if(kc>=65&&kc<=90)return String.fromCharCode(shift?kc:kc+32);
  if(kc===189||kc===109)return '-';
  if(kc===190||kc===110)return '.';
  return '';
}
document.addEventListener('keydown',function(e){
  var kc=e.keyCode||0, wh=e.which||0;
  lines.push('key="'+e.key+'" keyCode='+kc+' which='+wh);
  if(lines.length>25)lines.shift();
  logEl.textContent=lines.join('\n');
  if(e.key==='Enter'||kc===13){recon.textContent=buf||'(vide)';buf='';return;}
  var ch='';
  if(e.key&&e.key.length===1&&e.key!=='Unidentified')ch=e.key;
  else ch=kc2char(kc,e.shiftKey);
  if(ch)buf+=ch;
  recon.textContent=buf||'-';
},true);
fieldEl.addEventListener('input',function(){fieldval.textContent=fieldEl.value||'-';});
setTimeout(function(){fieldEl.focus();},300);
</script>
</body>
</html>
